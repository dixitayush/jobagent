# CI (PRD §104): typecheck → unit tests → integration tests → eval → build → docker build.
# Deployment is ./deploy.sh (Docker on the VPS behind Traefik); CI never deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: jobagent
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U jobagent" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6381:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run eval
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., target: api, push: false, tags: "jobagent-api:ci" }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., target: web, push: false, tags: "jobagent-web:ci" }
